<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Leads - Sem Site</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons para o ícone do WhatsApp -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #6610f2, #0d6efd); color: white; padding: 2rem 0; margin-bottom: 2rem; border-radius: 0 0 1rem 1rem; }
        .card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05); }
        .hidden { display: none; }
        #loadingSpinner { margin: 2rem 0; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; }
        .btn-whatsapp:hover { background-color: #1ea952; color: white; }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Buscador de Leads</h1>
            <p class="lead">Empresas no Google Maps que ainda não possuem website.</p>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-9">
                
                <!-- Formulário -->
                <div class="card p-4 mb-4">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label fw-bold">O que busca?</label>
                            <input type="text" id="profissao" class="form-control" placeholder="ex: Barbearias, Contadores">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-bold">Onde?</label>
                            <input type="text" id="cidade" class="form-control" placeholder="ex: Capão da Canoa, Xangri-lá">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button id="btnBuscar" class="btn btn-primary w-100 fw-bold" onclick="iniciarBusca()">
                                Buscar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Area de Carregamento -->
                <div id="loadingSpinner" class="text-center hidden">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-3 text-muted fw-bold">O robô está navegando no Google Maps...<br>Isso pode levar alguns segundos.</p>
                </div>

                <!-- Tabela de Resultados -->
                <div id="resultadosArea" class="hidden">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="h5 mb-0">Empresas sem site encontradas (<span id="totalLeads">0</span>)</h3>
                        <button class="btn btn-success btn-sm fw-bold" onclick="baixarPlanilha()">
                            Baixar Excel (.xlsx)
                        </button>
                    </div>
                    
                    <div class="card p-2">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Nome</th>
                                        <th>Telefone</th>
                                        <th>Endereço</th>
                                        <th class="text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaBody">
                                    <!-- Dados inseridos via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Mensagem de Erro -->
                <div id="erroMensagem" class="alert alert-danger hidden" role="alert"></div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
    
    <script>
        let dadosAtuais = [];

        async function iniciarBusca() {
            const profissao = document.getElementById('profissao').value;
            const cidade = document.getElementById('cidade').value;
            const btn = document.getElementById('btnBuscar');
            const spinner = document.getElementById('loadingSpinner');
            const resultados = document.getElementById('resultadosArea');
            const erro = document.getElementById('erroMensagem');
            const tabelaBody = document.getElementById('tabelaBody');

            if(!profissao || !cidade) {
                alert("Por favor, preencha a profissão e a cidade.");
                return;
            }

            // UI State: Carregando
            btn.disabled = true;
            btn.innerHTML = "Buscando...";
            spinner.classList.remove('hidden');
            resultados.classList.add('hidden');
            erro.classList.add('hidden');
            tabelaBody.innerHTML = '';
            dadosAtuais = [];

            try {
                const response = await fetch('/api/buscar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profissao, cidade })
                });

                // Checa se a resposta não é um JSON válido
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("O servidor demorou muito para responder ou ocorreu um erro interno.");
                }

                const dados = await response.json();

                if (dados.erro) {
                    throw new Error(dados.erro);
                }

                if (dados.length === 0) {
                    erro.innerHTML = "Nenhuma empresa sem site foi encontrada para essa busca.";
                    erro.classList.remove('hidden');
                } else {
                    dadosAtuais = dados;
                    document.getElementById('totalLeads').innerText = dados.length;
                    
                    dados.forEach(empresa => {
                        // Renderização condicional do botão de WhatsApp
                        let botaoWhatsapp = '<span class="text-muted small">Indisponível</span>';
                        if (empresa.WhatsApp) {
                            botaoWhatsapp = `<a href="${empresa.WhatsApp}" target="_blank" class="btn btn-whatsapp btn-sm fw-bold">
                                <i class="bi bi-whatsapp me-1"></i> Chamar
                            </a>`;
                        }

                        const row = `<tr>
                            <td class="fw-bold">${empresa.Nome}</td>
                            <td>${empresa.Telefone}</td>
                            <td class="text-muted small">${empresa.Endereço}</td>
                            <td class="text-center">${botaoWhatsapp}</td>
                        </tr>`;
                        tabelaBody.innerHTML += row;
                    });
                    resultados.classList.remove('hidden');
                }

            } catch (e) {
                erro.innerHTML = `❌ Erro na busca: ${e.message}`;
                erro.classList.remove('hidden');
            } finally {
                // UI State: Finalizado
                btn.disabled = false;
                btn.innerHTML = "Buscar";
                spinner.classList.add('hidden');
            }
        }

        async function baixarPlanilha() {
            if(dadosAtuais.length === 0) return;

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dadosAtuais)
                });

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "leads_sem_site.xlsx";
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                alert("Erro ao baixar planilha.");
            }
        }
    </script>
</body>
</html>
